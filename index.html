<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAJAD - للخدمات الإلكترونية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-primary: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #2563eb, #7c3aed);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(124, 58, 237, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .logo-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
        }

        .logo-box {
            width: 100%;
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.35);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .subtitle {
            display: inline-block;
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.25);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }

            text-align: right;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 25px 5px 12px
